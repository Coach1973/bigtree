<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大樹教練 · 過往講座歷史紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:56px 20px 40px;font-family:"Noto Sans TC",sans-serif;background:#f1e9d8;color:#1c2a28}
  .serif{font-family:"Noto Serif TC",serif}
  .wrap{max-width:1120px;margin:0 auto}

  /* ===== 標題區 ===== */
  h1{text-align:center;font-size:34px;margin:0 0 10px;letter-spacing:.02em}
  .sub{text-align:center;color:#4b5b58;font-size:15px;margin-bottom:6px}
  .note{text-align:center;color:#9a958a;font-size:13px;margin-bottom:28px}
  .count{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:38px}
  .count .num{font-family:"Noto Serif TC",serif;font-size:64px;font-weight:900;color:#c25e22;line-height:1}
  .count .unit{font-size:17px;font-weight:800;color:#163b35;letter-spacing:.08em}

  /* ===== 宮格 ===== */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;cursor:pointer;
        background:#1c2a28;border:1px solid #e5ddc9;transition:transform .22s ease,box-shadow .22s ease}
  .cell:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(28,42,40,.28)}
  .cell img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .35s ease}
  .cell:hover img{transform:scale(1.06)}
  .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,20,19,.92) 0%,rgba(12,20,19,.55) 38%,rgba(12,20,19,0) 68%);
        display:flex;flex-direction:column;justify-content:flex-end;padding:12px 13px}
  .veil .d{color:#f6b98a;font-size:12.5px;font-weight:800;letter-spacing:.06em;margin-bottom:3px}
  .veil .t{color:#fff;font-size:15px;font-weight:800;line-height:1.35;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .no{position:absolute;top:9px;left:10px;background:rgba(255,255,255,.9);color:#c25e22;
      font-size:11.5px;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:.04em}
  .web{position:absolute;top:9px;right:10px;background:#c25e22;color:#fff;
       font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}

  /* ===== 彈窗 ===== */
  .modal{position:fixed;inset:0;background:rgba(12,20,19,.82);z-index:50;display:none;
         align-items:center;justify-content:center;padding:24px}
  .modal.on{display:flex}
  .box{background:#fffdf7;border-radius:20px;max-width:860px;width:100%;max-height:88vh;overflow-y:auto;
       display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:0;position:relative}
  .box .pic{background:#f1e9d8;display:flex;align-items:center;justify-content:center;padding:18px;
            border-radius:20px 0 0 20px}
  .box .pic img{max-width:100%;max-height:70vh;border-radius:10px;display:block;border:1px solid #e5ddc9}
  .box .info{padding:34px 32px 30px}
  .box .date{color:#c25e22;font-weight:800;font-size:13.5px;letter-spacing:.05em;margin-bottom:8px}
  .box h3{margin:0 0 14px;font-size:22px;line-height:1.4}
  .box p{margin:0 0 18px;color:#4b5b58;line-height:1.85;font-size:14.5px}
  .box a.link{display:inline-block;background:#c25e22;color:#fff;font-weight:800;text-decoration:none;
              font-size:14px;padding:10px 20px;border-radius:30px}
  .box a.link:hover{background:#a54d18}
  .tag{display:inline-block;background:#fcd2b5;color:#c25e22;font-size:12px;font-weight:800;
       padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .x{position:absolute;top:12px;right:14px;width:34px;height:34px;border:none;border-radius:50%;
     background:rgba(28,42,40,.08);color:#1c2a28;font-size:20px;cursor:pointer;line-height:1}
  .x:hover{background:rgba(28,42,40,.18)}

  .back{display:block;text-align:center;margin-top:44px;color:#163b35;font-weight:700;text-decoration:none}

  @media(max-width:900px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .box{grid-template-columns:1fr;max-height:86vh}
    .box .pic{border-radius:20px 20px 0 0;padding:16px}
    .box .pic img{max-height:44vh}
    .box .info{padding:24px 22px 26px}
  }
  @media(max-width:560px){
    body{padding:36px 14px 30px}
    h1{font-size:26px}
    .count .num{font-size:50px}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .veil .t{font-size:13.5px}
    .veil .d{font-size:11.5px}
  }
</style>
</head>

function buildGrid(){
  const grid = document.getElementById('grid');
  EVENTS.forEach((e, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.onclick = () => openModal(i);
    cell.innerHTML = `
      <img loading="lazy" src="${e.img}" alt="${e.short}">
      <div class="veil">
        <div class="d">${e.grid}</div>
        <div class="t">${e.short}</div>
      </div>
      <div class="no">第 ${i + 1} 場</div>
      ${e.link ? '<div class="web">有網頁</div>' : ''}
    `;
    grid.appendChild(cell);
  });
  document.getElementById('countNum').textContent = EVENTS.length;
}

function openModal(i){
  const e = EVENTS[i];
  document.getElementById('mImg').src = e.img;
  document.getElementById('mImg').alt = e.short;
  document.getElementById('mDate').textContent = e.date;
  document.getElementById('mTitle').innerHTML = e.title + (e.link ? '<span class="tag">有網頁</span>' : '');
  document.getElementById('mDesc').textContent = e.desc;
  const link = document.getElementById('mLink');
  if (e.link) { link.href = e.link; link.style.display = 'inline-block'; }
  else { link.style.display = 'none'; }
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
buildGrid();
